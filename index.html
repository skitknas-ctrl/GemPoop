<!DOCTYPE html>
<html lang="en">
<head>

<title>GemPoop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #191715; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f5e6c8; }
  #wrap { position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #view { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; height: 720px; transform-origin: 0 0; overflow: hidden; background: #191715; }

  .side { position: absolute; top: 0; height: 720px; overflow: hidden; }
  .zone { position: absolute; inset: 0; touch-action: none; cursor: ns-resize; }
  .print { position: absolute; pointer-events: none; }
  .mline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed #f5e6c8; pointer-events: none; }
  .mring { position: absolute; width: 72px; height: 72px; box-sizing: border-box; border: 3px solid #f5e6c8;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .hud { position: absolute; top: 48px; display: flex; flex-direction: column; gap: 16px; pointer-events: none; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo b { font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; font-weight: 900;
    font-size: 44px; line-height: 1; letter-spacing: 0.5px; }
  .stats { display: flex; gap: 24px; }
  .lbl { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #b8ad9c; }
  .num { font-size: 36px; font-weight: 900; line-height: 1.05; }
  .num.small { font-size: 26px; }
  .hint { position: absolute; bottom: 40px; display: flex; align-items: center; gap: 10px; font-size: 16px;
    font-weight: 600; color: #9a907f; pointer-events: none; line-height: 1.3; }
  .gear { pointer-events: auto; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #3d3832;
    background: #2a2723; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .gear:focus-visible, .btn:focus-visible { outline: 3px solid #f5e6c8; outline-offset: 3px; }

  #field { position: absolute; top: 0; width: 720px; height: 720px; overflow: hidden; background: #1d4434;
    box-shadow: 0 0 0 4px #0e0d0c; }
  .abs { position: absolute; }
  .gem { position: absolute; left: 0; top: 0; width: 30px; height: 30px; pointer-events: none; will-change: transform; }
  .tongue { position: absolute; height: 8px; border-radius: 4px; background: #e65a7f; transform-origin: 0 50%;
    pointer-events: none; display: none; }
  .tongue i { position: absolute; right: -7px; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: #f27c9a; }
  .drop { position: absolute; left: 0; top: 0; width: 7px; height: 10px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: #c4102c; pointer-events: none; }
  .thumb { position: absolute; left: 0; top: 0; width: 220px; height: 1800px; pointer-events: none; display: none; transform-origin: 110px 8px; }
  #tutBoard { position: absolute; left: 84px; width: 552px; top: 205px; height: 330px; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center; color: #ffffff; pointer-events: none; }
  #tutBoard .tstep { font-size: 16px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; opacity: 0.9;
    text-shadow: 0 2px 0 #3b2213, 0 0 8px rgba(40, 20, 5, 0.8); }
  #tutText { font-size: 31px; font-weight: 900; line-height: 1.3;
    text-shadow: 0 2px 0 #3b2213, 0 3px 0 #3b2213, 0 0 12px rgba(40, 20, 5, 0.85); }
  .tutnav { position: absolute; left: 32px; right: 32px; top: 230px; display: none; flex-direction: column; gap: 48px; }
  .tutnav .btn { background: #f6eedc; }
  .tutnav .btn.primary { background: #6b3f1d; }
  .overlay.clear { background: transparent; }
  .panel.bare { width: auto; background: transparent; box-shadow: none; padding: 0; overflow: visible; }
  .startBtns { display: flex; gap: 24px; margin-top: 120px; }
  .btn.big { min-height: 76px; min-width: 210px; font-size: 28px; border-radius: 18px; border-width: 3px; background: #f6eedc;
    box-shadow: 0 6px 0 #3b2213; }
  .btn.big.primary { background: #6b3f1d; color: #fff; }
  .piece { position: absolute; left: 0; top: 0; width: 22px; height: 8px; border-radius: 4px; background: #e65a7f; pointer-events: none; }
  .reach { position: absolute; box-sizing: border-box; border-radius: 50%; border: 2px dashed; opacity: 0.6; pointer-events: none; }
  .frog { position: absolute; top: 128px; width: 64px; height: 52px; transform-origin: 50% 100%; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
  .float { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 26px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 2px 0 rgba(0,0,0,0.55); }
  #banner { position: absolute; left: 0; top: 300px; width: 720px; text-align: center; pointer-events: none; opacity: 0; }
  #banner b { display: block; font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 900;
    font-size: 72px; line-height: 1; color: #fff7e6; text-shadow: 0 4px 0 #3b2213; }
  #banner span { display: block; margin-top: 10px; font-size: 22px; font-weight: 800; color: #ffd0d8; text-shadow: 0 2px 0 #3b2213; }

  .overlay { position: absolute; top: 0; width: 720px; height: 720px; background: rgba(10, 8, 6, 0.62);
    display: none; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .panel { width: 520px; max-height: 660px; overflow: auto; box-sizing: border-box; padding: 28px 30px; border-radius: 18px;
    background: #f6eedc; color: #2a1d12; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 0 0 4px #6b3f1d; }
  .panel.wide { width: 620px; }
  .panel h2 { margin: 0; font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 900;
    font-size: 38px; line-height: 1; }
  .panel p { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: #4a3826; }
  .panel .warn { color: #9b1029; font-weight: 800; }
  .tally { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 18px; font-weight: 700; }
  .tally .v { text-align: right; font-weight: 900; }
  .tally .tot { border-top: 2px solid #d9c9a8; padding-top: 8px; font-size: 22px; }
  .shop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .card { border: 2px solid #d9c9a8; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column;

  .card .name { font-weight: 900; font-size: 16px; }
  .card .reachv { font-size: 14px; font-weight: 700; color: #6b5a48; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; font-weight: 800; }
  .row .top span { color: #6b3f1d; }
  .row small { font-size: 14px; font-weight: 600; color: #6b5a48; }
  .row input[type=range] { width: 100%; accent-color: #6b3f1d; height: 28px; margin: 0; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
  .check input { width: 22px; height: 22px; accent-color: #6b3f1d; margin: 0; }
  .btns { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .btn { min-height: 48px; padding: 0 22px; border-radius: 12px; border: 2px solid #6b3f1d; background: transparent;
    color: #6b3f1d; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
  .btn.primary { background: #6b3f1d; color: #fff; padding: 0 26px; }
  .btn.buy { min-height: 44px; width: 100%; padding: 0 8px; font-size: 15px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: #191715; font-size: 22px; font-weight: 800; padding: 32px; box-sizing: border-box; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>

    var a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    var x = x0, y = GP.ANUS_Y, vx = 0, vy = 60, bounced = false, pts = [], h = 1 / 240;
    for (var t = 0; t < 4; t += h) {
      vy += GP.G * h; x += vx * h; y += vy * h;
      if (bounced && vy > 0) break;
      var px = x - GP.PX, py = y - GP.PY, along = px * ca + py * sa, dist = px * sa - py * ca, vn = vx * sa - vy * ca;
      if (Math.abs(along) <= GP.HALF + 4 && dist < GP.RG && dist > -GP.RG * 2.5 && vn < 0) {
        var j = (1 + GP.E) * vn; vx -= j * sa; vy += j * ca;
        var push = GP.RG - dist; x += sa * push; y -= ca * push; bounced = true;
      }
      if (bounced) pts.push(x, y);
      if (y > GP.S + 40) break;
    }
    return pts;
  }
  function aim(x0, tx, ty, avoid) {
    var best = 0, bestScore = 1e9;
    for (var deg = -GP.MAXA; deg <= GP.MAXA + 0.001; deg += 0.1) {
      var pts = simulate(x0, deg); if (!pts.length) continue;
      var dmin = 1e9, pen = 0;
      for (var i = 0; i < pts.length; i += 2) {
        var d = Math.hypot(pts[i] - tx, pts[i + 1] - ty); if (d < dmin) dmin = d;
        for (var k = 0; k < avoid.length; k++) if (Math.hypot(pts[i] - avoid[k].x, pts[i + 1] - avoid[k].y) < avoid[k].r) pen = 1000;
      }
      if (dmin + pen < bestScore) { bestScore = dmin + pen; best = deg; }
    }
    var diff = best / GP.MAXA;
    tut.yL = 0.5 - 0.25 * diff; tut.yR = 0.5 + 0.25 * diff;
  }
  function frogZone(i, pct, extra) { var f = s.frogs[i]; return { x: f.x, y: f.my, r: pct / 100 * GP.S + (extra || 0) }; }

  function startTutorial() {
    clearField(); resetFrogs(); hideScreen();
    s.state = 'tutorial';
    $('tutBoard').style.display = 'flex'; $('stencil').style.opacity = '0'; $('tutNav').style.display = 'flex';
    tutEnter(1);
  }
  function endTutorial() {
    $('tutBoard').style.display = 'none'; $('stencil').style.opacity = '0.55'; $('tutNav').style.display = 'none';
    tut.step = 0; tut.only = -1;
  }
  function tutEnter(n) {
    clearField();
    tut.step = n; tut.t = 0; tut.fired = {}; tut.only = -1;
    $('tutStep').textContent = 'Tutorial ' + n + ' / 5';
    $('tutText').textContent = TUT_TEXT[n - 1];
    $('tutNext').textContent = n < 5 ? 'Next' : 'Start game';
    var base = s.baseReach;
    s.frogs.forEach(function (f) { f.reach = f.shown = (n === 4 ? 14 : base); f.ups = 0; });
    tut.yL = tut.yR = 0.5;
    if (n === 1) aim(s.monkeys[2].x, s.frogs[0].x, s.frogs[0].my, []);
    if (n === 2) aim(s.monkeys[2].x, s.frogs[1].x, s.frogs[1].my - 10, [frogZone(2, base, 12)]);
    if (n === 4) { tut.only = 2; aim(s.monkeys[1].x, s.frogs[2].x, s.frogs[2].my, [frogZone(0, 14, 8), frogZone(1, 14, 8)]); }
  }
  function tutGem(mi, c) { var g = makeGem(s.monkeys[mi], c); g.tut = true; }
  function tutUpdate(dt) {
    tut.t += dt;
    var t = tut.t, F = tut.fired;
    if (tut.step === 1 || tut.step === 2) {
      if (t >= 0.6 && !F.a) { F.a = true; tutGem(2, tut.step === 1 ? 0 : 2); }
      if (t >= 5.2) { tut.t = 0; tut.fired = {}; }
    } else if (tut.step === 3) {
      var stepR = [8, 10, 12, 14, 14][Math.floor(t / 0.9) % 5];
      s.frogs.forEach(function (f) { f.reach = stepR; });
    } else if (tut.step === 4) {
      if (t >= 1.0 && !F.a) { F.a = true; tutGem(1, RED); }
      if (t >= 6.5) { tut.t = 0; tut.fired = {}; s.frogs.forEach(function (f) { f.reach = 14; }); }
    }
  }
  $('tutNext').addEventListener('click', function () {
    if (tut.step < 5) tutEnter(tut.step + 1); else newGame();
  });
  $('tutClose').addEventListener('click', function () { renderStart(); });

  // ---- Physics ----
  function step(dt) {
    if (s.state === 'play' && s.spawned < GP.PER_LEVEL) {
      var interval = 1 / rateFor(s.level);
      if (s.spawnT > interval + GP.BANNER) s.spawnT = interval;
      s.spawnT -= dt;
      if (s.spawnT <= 0) { if (beginGem()) s.spawnT += interval; else s.spawnT = 0.05; }
    }
    s.monkeys.forEach(function (m) { m.pop = Math.max(0, m.pop - dt); });

    var a = s.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);

    for (var i = 0; i < s.gems.length; i++) {
      var g = s.gems[i];
      g.age += dt;
      if (g.state === 'emerging') {
        g.t += dt;
        if (g.t >= GP.PUSH) plop(g);
        continue;
      }
      if (g.state === 'fly') {
        var sub = 3, h = dt / sub;
        for (var k = 0; k < sub; k++) {
          g.vy += GP.G * h;            // falls faster and faster, rises slower and slower
          g.x += g.vx * h;
          g.y += g.vy * h;
          g.rot += g.spin * h;
          // top of the bounce reached: the gem is lost, shrinks and disappears
          if (g.bounced && g.vy > 0) {
            g.state = 'vanish'; g.t = 0;
            missed(g, g.x - 12, g.y - 30);
            break;
          }
          // bounce on the tilted paddle, normal n = (sin a, −cos a)
          var px = g.x - GP.PX, py = g.y - GP.PY;
          var along = px * ca + py * sa;
          var dist = px * sa - py * ca;
          var vn = g.vx * sa - g.vy * ca;
          if (Math.abs(along) <= GP.HALF + 4 && dist < GP.RG && dist > -GP.RG * 2.5 && vn < 0) {
            var j = (1 + GP.E) * vn;
            g.vx -= j * sa; g.vy += j * ca;
            var push = GP.RG - dist;
            g.x += sa * push; g.y -= ca * push;
            g.bounced = true; g.spin = g.vx / 60; s.flash = 0.12;
          }
        }
        // within reach of a frog on the way up?
        if (g.state === 'fly' && g.bounced && !g.spent) {
          var target = null;
          if (g.red) {
            var bd = 1e9;
            s.frogs.forEach(function (f) {
              if (f.tongue) return;
              if (s.state === 'tutorial' && tut.only >= 0 && f.c !== tut.only) return;
              var d = Math.hypot(g.x - f.x, g.y - f.my);
              if (d < f.reach / 100 * GP.S && d < bd) { bd = d; target = f; }
            });
          } else {
            var f0 = s.frogs[g.c];
            if (!f0.tongue && Math.hypot(g.x - f0.x, g.y - f0.my) < f0.reach / 100 * GP.S) target = f0;
          }
          if (target) {
            target.tongue = { gem: g, phase: 'out', t: 0, sx: g.x, sy: g.y, tx: target.x, ty: target.my, red: g.red };
            g.state = 'snared';
            if (!g.red) sfx.slurp();
          }
        }
        if (g.state === 'fly' && (g.y > GP.S + 40 || g.x < -40 || g.x > GP.S + 40)) {
          g.dead = true;
          missed(g, clamp(g.x, 30, 680), 680);
        }
      } else if (g.state === 'vanish') {
        g.t += dt;
        if (g.t > GP.VANISH) g.dead = true;
      }
    }

    s.frogs.forEach(function (f) {
      var tg = f.tongue;
      if (tg) {
        tg.t += dt;
        if (tg.phase === 'out') {
          var u = Math.min(1, tg.t / GP.T_OUT);
          tg.tx = f.x + (tg.sx - f.x) * u; tg.ty = f.my + (tg.sy - f.my) * u;
          if (tg.t >= GP.T_OUT) {
            if (tg.red) {
              // the sharp red gem cuts the tongue back to its original length
              var g = tg.gem;
              g.state = 'fly'; g.spent = true; g.vx *= 0.4; g.vy = Math.max(60, g.vy * 0.3);
              snipFx(tg.tx, tg.ty, (tg.tx - f.x) * 1.5);
              sfx.snip();
              f.tongue = null; f.hurt = 0.7;
              var lost = f.reach - s.baseReach;
              f.reach = s.baseReach; f.ups = 0;
              floatText(f.x - 30, f.my - 70, lost > 0 ? 'SNIP! −' + lost + ' %' : 'SNIP!', '#d0243f');
            } else { tg.phase = 'in'; tg.t = 0; }
          }
        } else {
          var w = Math.max(0, 1 - tg.t / GP.T_IN);
          tg.tx = f.x + (tg.sx - f.x) * w; tg.ty = f.my + (tg.sy - f.my) * w;
          tg.gem.x = tg.tx; tg.gem.y = tg.ty;
          if (tg.t >= GP.T_IN) {
            tg.gem.dead = true; f.tongue = null; f.gulp = GP.GULP;
            if (s.state === 'play') s.caughtL++;
            floatText(f.x - 12, f.my - 70, '+1', '#15803d');
          }
        }
      }
      f.gulp = Math.max(0, f.gulp - dt);
      f.hurt = Math.max(0, f.hurt - dt);
    });

    s.gems = s.gems.filter(function (g) { if (g.dead) g.el.remove(); return !g.dead; });

    // level over when every gem has been resolved
    if (s.state === 'play' && s.spawned >= GP.PER_LEVEL && !s.gems.some(function (g) { return g.state !== 'vanish'; }) &&
        s.frogs.every(function (f) { return !f.tongue; })) {
      s.endT += dt;
      if (s.endT > 1.0) endLevel();
    }
  }

  // things that move in every state: thumbs, paddle, rings, tutorial script
  function ambient(dt) {
    s.clock += dt;
    var demo = s.state === 'start' || (s.state === 'tutorial' && tut.step === 5);
    if (demo) {
      var w = Math.sin(s.clock * 1.5);
      s.yL = 0.5 + 0.22 * w; s.yR = 0.5 - 0.22 * w;
    } else if (s.state === 'tutorial') {
      var k = Math.min(1, dt * 4);
      s.yL += (tut.yL - s.yL) * k; s.yR += (tut.yR - s.yR) * k;
    }
    var diff = clamp((s.yR - s.yL) / 0.5, -1, 1);
    s.angle += (GP.MAXA * diff - s.angle) * Math.min(1, dt * 18);
    s.flash = Math.max(0, s.flash - dt);
    s.bannerT = Math.max(0, s.bannerT - dt);
    s.frogs.forEach(function (f) { f.shown += (f.reach - f.shown) * Math.min(1, dt * 5); });
    if (s.state === 'tutorial') tutUpdate(dt);
  }

  function stepFx(dt) {
    s.fx.forEach(function (p) {
      p.t += dt;
      if (p.kind === 'piece' || p.kind === 'drop') { p.vy += GP.G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += 8 * dt; }
      else p.y -= 40 * dt;
      if (p.t > p.life) p.dead = true;
    });
    s.fx = s.fx.filter(function (p) { if (p.dead) p.el.remove(); return !p.dead; });
  }

  // ---- Draw ----
  var shown = {};
  function setText(id, v) { if (shown[id] !== v) { shown[id] = v; $(id).textContent = v; } }
  function ringsVisible() {
    if (s.state === 'tutorial') return tut.step === 3 || tut.step === 4;
    return s.state === 'play' || s.state === 'shop';
  }
  function draw() {
    $('paddle').style.transform = 'rotate(' + s.angle.toFixed(2) + 'deg)';
    $('paddle').style.boxShadow = '0 0 ' + (s.flash / 0.12 * 18).toFixed(1) + 'px #fff2c4';
    s.monkeys.forEach(function (m) {
      var sc, k, c;
      if (m.busy) {
        var e = m.busy.t / GP.PUSH, ee = e * e * (3 - 2 * e);
        sc = 1 + 0.6 * ee + 0.05 * ee * Math.sin(m.busy.t * 38);   // straining, widening
        k = Math.min(1, e * 1.4); c = m.busy.c;                    // rim takes on the gem's colour
      } else {
        sc = 1 + 0.6 * (m.pop / GP.POP);                             // snaps back after the plop
        k = m.pop / GP.POP; c = m.lastC;                             // and fades back
      }
      m.el.setAttribute('transform', 'translate(70 58) scale(' + sc.toFixed(3) + ')');
      var col = RIM_COLORS[c];
      m.rim.setAttribute('fill', k > 0.001 ? hexMix(m.base, col, k) : m.base);
      if (s.glow > 0 && k > 0.001) {
        var R = (12 + s.glow * 0.6) * (0.6 + 0.4 * sc / 1.6);
        m.glow.style.left = (m.x - R) + 'px'; m.glow.style.top = (GP.ANUS_Y - R) + 'px';
        m.glow.style.width = m.glow.style.height = (2 * R).toFixed(1) + 'px';
        m.glow.style.background = 'radial-gradient(circle, ' + col + 'cc 0%, ' + col + '66 30%, ' + col + '00 70%)';
        m.glow.style.opacity = (k * (0.85 + 0.15 * Math.sin(Date.now() / 60))).toFixed(3);
      } else m.glow.style.opacity = '0';
    });
    var rings = ringsVisible(), swing = s.state === 'tutorial' && tut.step === 3;
    s.frogs.forEach(function (f, i) {
      var R = f.shown / 100 * GP.S;
      f.ring.style.display = rings ? 'block' : 'none';
      f.ring.style.left = (f.x - R).toFixed(1) + 'px'; f.ring.style.top = (f.my - R).toFixed(1) + 'px';
      f.ring.style.width = f.ring.style.height = (2 * R).toFixed(1) + 'px';
      var best = null, bd = 1e9;
      s.gems.forEach(function (g) {
        if (g.c !== f.c || g.state === 'vanish' || g.state === 'emerging') return;
        var d = Math.hypot(g.x - f.x, g.y - f.my);
        if (d < bd) { bd = d; best = g; }
      });
      var ex = 0, ey = 0;
      if (best && bd > 1) { ex = (best.x - f.x) / bd * 2.4; ey = (best.y - f.my) / bd * 2.4; }
      var tg = f.tongue, ang = 0, len = 0;
      if (tg) { var dx = tg.tx - f.x, dy = tg.ty - f.my; len = Math.hypot(dx, dy); ang = Math.atan2(dy, dx); }
      else if (swing) { ang = Math.PI / 2 + (2 * Math.PI / 3) * Math.sin(s.clock * 2.2 + i * 1.3); len = R; ex = Math.cos(ang) * 2.4; ey = Math.sin(ang) * 2.4; }
      f.pp.setAttribute('transform', 'translate(' + ex.toFixed(2) + ' ' + ey.toFixed(2) + ')');
      var gl = f.gulp > 0 ? Math.sin((f.gulp / GP.GULP) * Math.PI) : 0;
      var shake = f.hurt > 0 ? Math.sin(f.hurt * 70) * 4 * (f.hurt / 0.7) : 0;
      f.el.style.transform = 'translateX(' + shake.toFixed(2) + 'px) scale(' + (1 + 0.1 * gl).toFixed(3) + ',' + (1 - 0.12 * gl).toFixed(3) + ')';
      f.mo.setAttribute('opacity', (tg || swing || f.hurt > 0) ? 1 : 0);
      if (tg || swing) {
        f.tEl.style.display = 'block';
        f.tEl.style.width = len.toFixed(1) + 'px';
        f.tEl.style.transform = 'rotate(' + ang.toFixed(4) + 'rad)';
      } else f.tEl.style.display = 'none';
    });
    s.gems.forEach(function (g) {
      var o = 1, sc = 1, x = g.x, y = g.y, rot = g.rot;
      if (g.state === 'emerging') {
        // can just be glimpsed in the anus, then pushes out over one second
        var e = g.t / GP.PUSH;
        sc = 0.25 + 0.4 * e * e; o = 0.5 + 0.5 * e;
        rot = Math.sin(g.t * 9) * 0.15 * e;
        x = g.m.x; y = GP.ANUS_Y;
      } else if (g.state === 'vanish') {
        var k = Math.min(1, g.t / GP.VANISH);
        sc = 1 - k; o = 1 - 0.5 * k;
      } else {
        sc = Math.min(1, 0.6 + (g.age / 0.12) * 0.4);
      }
      g.el.style.opacity = o.toFixed(3);
      g.el.style.transform = 'translate(' + (x - 15).toFixed(1) + 'px,' + (y - 15).toFixed(1) + 'px) rotate(' + rot.toFixed(3) + 'rad) scale(' + Math.max(0, sc).toFixed(3) + ')';
    });
    s.fx.forEach(function (p) {
      var o = 1 - Math.pow(p.t / p.life, 2);
      p.el.style.opacity = o.toFixed(3);
      p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)' + (p.kind === 'piece' ? ' rotate(' + p.rot.toFixed(2) + 'rad)' : '');
    });
    var bo = s.state === 'play' ? Math.min(1, s.bannerT / 0.4) : 0;
    $('banner').style.opacity = bo.toFixed(3);
    var demoThumbs = s.state === 'start' || s.state === 'tutorial';
    ['L', 'R'].forEach(function (side) {
      var y = s['y' + side] * 720, op = demoThumbs ? 0 : (s['a' + side] ? 0.95 : 0.4);
      var line = $('line' + side), ring = $('ring' + side), th = $('thumb' + side);
      line.style.top = (y - 1) + 'px'; ring.style.top = (y - 36) + 'px';
      line.style.opacity = ring.style.opacity = op;
      th.style.display = demoThumbs ? 'block' : 'none';
      // the tip sits at the thumb's height; the thumb comes in at a slant from below, pointing at the middle of the top edge
      var tipX = side === 'L' ? lastSide * 0.58 : lastSide * 0.42;
      var tx = side === 'L' ? lastSide + 360 : -360;
      var deg = Math.atan2(tx - tipX, y + 400) * 180 / Math.PI;   // aim a bit above the top edge so they stay slanted, like thumbs holding a phone
      th.style.transform = 'translate(' + (tipX - 110).toFixed(1) + 'px,' + (y - 8).toFixed(1) + 'px) rotate(' + deg.toFixed(1) + 'deg)';
    });
    setText('score', String(s.score));
    setText('level', String(s.level));
    setText('caught', String(s.caughtL));
    setText('missed', String(s.missedL));
    setText('left', String(Math.max(0, GP.PER_LEVEL - s.spawned)));
  }

  var last = null;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (last == null) { last = ts; return; }
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!s.paused && !document.hidden) {
      ambient(dt);
      if (s.state === 'play' || s.state === 'tutorial') step(dt);
      stepFx(dt);
    }
    draw();
  }
  document.addEventListener('visibilitychange', function () { last = null; });

  renderStart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
